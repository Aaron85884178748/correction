    <h1>Rejoindre ce Club</h1>
    <p>Remplis ce formulaire : nous te recontactons dans la semaine pour organiser ta première séance.</p>
    <form>
        <label for="prenom">Nom et Prenom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Nom et Prénom (Obligatoire)" required>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="Adresse e-mail, (obligatoire, doit être une adresse e-mail)" required>

        <label for="message">As-tu déjà grimper ? Raconte nous.</label>
        <textarea id="message"
            name="As-tu déjà grimper ? Raconte-nous . (facultatif, zone de texte sur plusieurs lignes)"></textarea>

        <button type="submit">Envoyer ma demande</button>
    </form>
    <footer>
        <p>Prise Haute, association sportive du lycée - 2026</p>
        <a href="prisehaute@exemple.fr  ">Nous écrire :</a>
    </footer>
